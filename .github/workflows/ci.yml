name: Full CI
on:
  pull_request:
  # A merge creates a new revision; Publish development image may consume only
  # a site-image verified for that exact master revision (see AGENTS.md).
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The attribution check walks every commit between base and head.
          fetch-depth: 0
      - name: Validate PR commit attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ruby scripts/check-commit-attribution.rb
      - name: Test commit attribution checker
        run: ruby scripts/test-commit-attribution.rb
      - name: Check shared files against the canonical source
        run: ruby scripts/check-shared-sync.rb
      - name: Test shared sync checker
        run: ruby scripts/test-shared-sync.rb
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show expected workflow formatting
        run: |
          npx prettier .github/workflows/ci.yml | diff -u .github/workflows/ci.yml - || true
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Root aliases are mutable, but asset URLs must bind to an immutable snapshot.
      - name: Build path-scoped snapshot
        env:
          SITE_SNAPSHOT_BASE: /${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: npm run build
      - name: Verify development route and temporary landing redirect
        run: |
          set -euo pipefail
          test -f dist/beta/index.html
          # A historical snapshot must never fetch mutable root /_astro assets.
          if grep -REn '(src|href)="/_astro/' dist --include='*.html'; then
            echo '::error::Unversioned Astro asset URL in immutable snapshot' >&2
            exit 1
          fi
          grep -Fq 'id="awakening"' dist/beta/index.html
          ! grep -Fq 'id="awakening"' dist/index.html
          grep -Fq 'host beta.aiaiaiai.org' deploy/Caddyfile
          grep -Fq 'rewrite @beta_root /beta/' deploy/Caddyfile
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
  validate:
    name: Validate
    needs: correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/
      - name: Package verified output
        run: docker build -t aiaiaiai-site:verified .
      - name: Check serving contract without activation
        run: |
          set -euo pipefail
          docker run --rm -d --name site -p 127.0.0.1:1927:1927 aiaiaiai-site:verified
          trap 'docker logs site; docker stop site' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:1927/healthz; then break; fi
            sleep 1
          done
          test "$(curl --fail --silent http://127.0.0.1:1927/healthz)" = ok
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:1927/)" = 302
          test "$(curl --silent -o /dev/null -w '%{redirect_url}' http://127.0.0.1:1927/)" = http://127.0.0.1:1927/beta/
          curl --fail --silent --header 'Host: beta.aiaiaiai.org' http://127.0.0.1:1927/ > /tmp/beta-root.html
          grep -Fq 'id="awakening"' /tmp/beta-root.html
          curl --fail --silent http://127.0.0.1:1927/beta/ > /tmp/beta.html
          grep -Fq 'id="awakening"' /tmp/beta.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:1927/not-a-route)" = 404
      - name: Preserve the validated container
        run: docker save aiaiaiai-site:verified | gzip > site-image.tar.gz
      - name: Bind build artifact to its exact triggering source ref
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -nc --arg ref "$SOURCE_REF" --arg sha "$SOURCE_SHA" '{ref: $ref, sha: $sha}' > site-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-image
          path: |
            site-image.tar.gz
            site-source.json
          if-no-files-found: error


  publish-beta:
    name: Publish merge-SHA beta image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: verified/
      - name: Verify exact master push artifact
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/master
          test "$(jq -er '.ref' verified/site-source.json)" = refs/heads/master
          test "$(jq -er '.sha' verified/site-source.json)" = "$GITHUB_SHA"
          test -s verified/site-image.tar.gz
      - name: Publish immutable beta from this exact master commit
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker load -i verified/site-image.tar.gz
          image="ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if inspection="$(docker manifest inspect "$image" 2>&1)"; then
            echo "::error::Immutable beta SHA is already published: $GITHUB_SHA" >&2
            exit 1
          elif ! grep -Eqi 'no such manifest|manifest unknown' <<<"$inspection"; then
            echo "::error::Cannot prove beta SHA image is unpublished" >&2
            exit 1
          fi
          docker tag aiaiaiai-site:verified "$image"
          docker push "$image"
          reference="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$reference" =~ ^ghcr.io/.+@(sha256:[0-9a-f]{64})$ ]]
          echo "name=ghcr.io/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Attest commit-bound beta provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish release image
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: verified/
      - name: Validate release ref and tested artifact
        id: source
        run: |
          set -Eeuo pipefail
          ref="$GITHUB_REF"
          sha="$GITHUB_SHA"
          [[ "$ref" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          tag="${ref#refs/tags/}"
          test "$(jq -er '.ref' verified/site-source.json)" = "$ref"
          test "$(jq -er '.sha' verified/site-source.json)" = "$sha"
          test -s verified/site-image.tar.gz
          git fetch --no-tags origin master
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha"
          git merge-base --is-ancestor "$sha" origin/master
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish exact validated release by immutable tag
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -Eeuo pipefail
          docker load -i verified/site-image.tar.gz
          image="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Never overwrite a release tag, nor mistake registry downtime for 404.
          if inspection="$(docker manifest inspect "$image" 2>&1)"; then
            echo "::error::Release image already exists: $RELEASE_TAG" >&2
            exit 1
          elif ! grep -Eqi 'no such manifest|manifest unknown' <<<"$inspection"; then
            echo "::error::Cannot prove release tag is unused" >&2
            exit 1
          fi
          docker tag aiaiaiai-site:verified "$image"
          docker push "$image"
          reference="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$reference" =~ ^ghcr.io/.+@(sha256:[0-9a-f]{64})$ ]]
          echo "name=ghcr.io/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Attest tag-bound provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
