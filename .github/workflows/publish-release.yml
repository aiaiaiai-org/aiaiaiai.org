# Publish only the exact Full CI artifact built for a SemVer tag. Tag is
# extracted from a validated artifact, not an ambiguous workflow_run head_branch.
name: Publish release image

on:
  workflow_run:
    workflows: [Full CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: aiaiaiai-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful source Full CI
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e '.conclusion == "success" and .event == "push" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == env.GITHUB_REPOSITORY' "$RUNNER_TEMP/source-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: verified/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify artifact source ref and immutable tag
        id: source
        run: |
          set -Eeuo pipefail
          test -s verified/site-source.json
          ref="$(jq -er '.ref' verified/site-source.json)"
          sha="$(jq -er '.sha' verified/site-source.json)"
          run_sha="$(jq -er '.head_sha' "$RUNNER_TEMP/source-run.json")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && test "$sha" = "$run_sha"
          if [[ "$ref" == refs/heads/master ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Master is published by Publish development image."
            exit 0
          fi
          [[ "$ref" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Full CI was not triggered by a SemVer release tag." >&2
            exit 1
          }
          tag="${ref#refs/tags/}"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$sha" origin/master
          test -s verified/site-image.tar.gz
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the validated release artifact
        if: steps.source.outputs.release == 'true'
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -Eeuo pipefail
          docker load -i verified/site-image.tar.gz
          image="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A tag is write-once. A remote outage is not proof of absence.
          if inspection="$(docker manifest inspect "$image" 2>&1)"; then
            echo "::error::Release tag is already published: $RELEASE_TAG" >&2
            exit 1
          elif ! grep -Eqi 'no such manifest|manifest unknown' <<<"$inspection"; then
            echo "::error::Cannot verify release tag is unused" >&2
            exit 1
          fi
          docker tag aiaiaiai-site:verified "$image"
          docker push "$image"
          reference="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$reference" =~ ^ghcr.io/.+@(sha256:[0-9a-f]{64})$ ]]
          echo "name=ghcr.io/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Attest release provenance
        if: steps.source.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
