# A release tag produces a separately verified, path-scoped image. Publication
# does not activate the production alias; Infra owns that decision.
name: Publish release image

on:
  workflow_run:
    workflows: [Full CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: aiaiaiai-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v') &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and successful Full CI artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e '.conclusion == "success" and .event == "push" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == env.GITHUB_REPOSITORY' "$RUNNER_TEMP/source-run.json"
          tag="$(jq -r .head_branch "$RUNNER_TEMP/source-run.json")"
          sha="$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$sha" origin/master
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: verified/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish exactly the validated tag artifact
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -Eeuo pipefail
          docker load -i verified/site-image.tar.gz
          image="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A release tag is write-once. Re-running the publisher must never
          # silently replace a previously advertised immutable artifact.
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::Release image tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          docker tag aiaiaiai-site:verified "$image"
          docker push "$image"
          reference="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$reference" =~ ^ghcr.io/.+@(sha256:[0-9a-f]{64})$ ]]
          echo "name=ghcr.io/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
