name: Publish verified image
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Full CI run containing the verified site-image artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and merged revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/ci.yml"' /tmp/run.json
          test "$(jq -r .head_repository.full_name /tmp/run.json)" = "$GITHUB_REPOSITORY"
          sha="$(jq -r .head_sha /tmp/run.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" origin/master
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: verified/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the exact validated container without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_SHA"
          docker load -i verified/site-image.tar.gz
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag aiaiaiai-site:verified "$image"
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'Verified image: `%s`\n\nDeploy manually through aiaiaiai-org/infra with workload `aiaiaiai-site`.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
